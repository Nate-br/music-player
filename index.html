<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="css/1-base.css">
  <link rel="stylesheet" href="css/2-sidebar.css">
  <link rel="stylesheet" href="css/3-topbar.css">
  <link rel="stylesheet" href="css/4-player.css">
  <link rel="stylesheet" href="css/5-sliders.css">
  <link rel="stylesheet" href="css/6-controls.css">
  <link rel="stylesheet" href="css/7-extra.css">
  <link rel="stylesheet" href="css/8-responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1DB954" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Player</span>
      </div>

      <div class="playlist-section">
<div class="sidebar-item" id="downloadBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download</span>
        </div>
        <div class="playlist-divider"></div>
        <div class="playlist-label">Playlist</div>
        <ul class="playlist-list" id="playlistList"></ul>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div class="nav-arrows">
          <button class="nav-arrow" id="backBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="nav-arrow" id="forwardBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="player-content">
        <div class="album-section">
          <div class="album-art-wrapper">
            <img id="albumArt" src="" alt="Album Art">
          </div>
        </div>

        <div class="track-section">
          <div class="track-info">
            <h2 class="song-title" id="songTitle">Song Title</h2>
            <p class="song-artist" id="songArtist">Artist Name</p>
          </div>

          <div class="progress-area">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-wrap">
              <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" step="0.1">
            </div>
            <span class="time" id="duration">0:00</span>
          </div>

          <div class="player-controls">
            <button class="control-btn" id="shuffleBtn" title="Shuffle">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
            <button class="control-btn" id="prevBtn" title="Previous"></button>
            <button class="control-btn play-control" id="playBtn" title="Play"></button>
            <button class="control-btn" id="nextBtn" title="Next"></button>
            <button class="control-btn" id="repeatBtn" title="Repeat">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>

          <div class="extra-controls">
            <div class="volume-wrap">
              <button class="control-btn small" id="muteBtn"></button>
              <input type="range" class="volume-bar" id="volumeBar" value="80" min="0" max="100">
            </div>
            <label class="autoplay-toggle">
              <input type="checkbox" id="autoplayToggle" checked>
              <span>Autoplay</span>
            </label>
            <button class="control-btn small" id="playlistToggle">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/1-playlist.js"></script>
  <script src="js/2-dom.js"></script>
  <script src="js/3-icons.js"></script>
  <script src="js/4-player.js"></script>
  <script src="js/5-progress.js"></script>
  <script src="js/6-ui.js"></script>
</body>
</html>
